version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: snapvault-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: snapvault
      MYSQL_USER: snapvault
      MYSQL_PASSWORD: snapvault
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "snapvault", "-psnapvault"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - snapvault-net

  app:
    build: .
    container_name: snapvault-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/snapvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: snapvault
      SPRING_DATASOURCE_PASSWORD: snapvault
      SNAPVAULT_VAULT_PATH: /data/vault
    ports:
      - "8080:8080"
    volumes:
      - app_vault:/data/vault
    networks:
      - snapvault-net

volumes:
  mysql_data:
  app_vault:

networks:
  snapvault-net:
    driver: bridge
